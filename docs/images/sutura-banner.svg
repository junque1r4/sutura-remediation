<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1280"
  height="480"
  viewBox="0 0 1280 480"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Sutura — from security finding to verified pull request</title>
  <desc id="desc">
    A navy and orange architecture banner showing scanners, a remediation agent, an isolated
    sandbox, and a pull request.
  </desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0e1729" />
      <stop offset="1" stop-color="#1b2c43" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#ff7b18" />
      <stop offset="1" stop-color="#ffb36c" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035" />
    </pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)" />
  <rect width="1280" height="480" rx="24" fill="url(#grid)" />
  <rect x="64" y="56" width="62" height="62" rx="16" fill="#ff7b18" />
  <path
    d="M107 74H87a8 8 0 0 0 0 16h10a8 8 0 0 1 0 16H77"
    fill="none"
    stroke="#101a2d"
    stroke-width="6"
    stroke-linecap="round"
  />
  <text
    x="146"
    y="104"
    fill="#fff"
    font-family="Arial, sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="-2"
  >
    Sutura
  </text>
  <text
    x="66"
    y="167"
    fill="#ffb36c"
    font-family="Arial, sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="3"
  >
    CONTINUOUS VULNERABILITY REMEDIATION
  </text>
  <text
    x="64"
    y="231"
    fill="#fff"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1"
  >
    Turn findings into verified fixes.
  </text>
  <text x="66" y="268" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="19">
    Generate. Test in isolation. Challenge the patch. Open a pull request.
  </text>
  <g font-family="Arial, sans-serif">
    <g fill="#17263c" stroke="#34455d">
      <rect x="64" y="326" width="245" height="92" rx="14" />
      <rect x="365" y="326" width="245" height="92" rx="14" />
      <rect x="666" y="326" width="245" height="92" rx="14" />
      <rect x="967" y="326" width="245" height="92" rx="14" />
    </g>
    <g fill="#ff9b4c" font-size="12" font-weight="700" letter-spacing="2">
      <text x="85" y="353">01 / INGEST</text>
      <text x="386" y="353">02 / REMEDIATE</text>
      <text x="687" y="353">03 / VALIDATE</text>
      <text x="988" y="353">04 / REVIEW</text>
    </g>
    <g fill="#fff" font-size="19" font-weight="700">
      <text x="85" y="386">Scanner findings</text>
      <text x="386" y="386">AI-generated patch</text>
      <text x="687" y="386">Isolated sandbox</text>
      <text x="988" y="386">GitHub pull request</text>
    </g>
    <g stroke="url(#accent)" stroke-width="2" fill="none">
      <path d="M319 372h34m-7-6 7 6-7 6" />
      <path d="M620 372h34m-7-6 7 6-7 6" />
      <path d="M921 372h34m-7-6 7 6-7 6" />
    </g>
  </g>
</svg>
